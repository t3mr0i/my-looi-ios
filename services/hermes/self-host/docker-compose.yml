name: looi-hermes-self-host

services:
  agent:
    build:
      context: ../../..
      dockerfile: services/hermes/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 110s
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ${LOOI_ENV_FILE:-/etc/looi-hermes.env}
    environment:
      LOOI_AGENT_HOST: "0.0.0.0"
      LOOI_AGENT_DB_PATH: /opt/data/looi-hermes/tasks.sqlite3
      LOOI_HERMES_HOME: /opt/data/looi-hermes/home
      HERMES_HOME: /opt/data/looi-hermes/home
      HERMES_SHARED_AUTH_DIR: /opt/data/looi-hermes/home/shared
      PORT: "8080"
    volumes:
      - hermes_data:/opt/data/looi-hermes
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - /opt/hermes/looi-agent-venv/bin/python
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3); assert r.status == 200"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hermes_data:
