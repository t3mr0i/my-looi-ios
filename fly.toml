app = "looi-hermes-agent"
primary_region = "fra"

[build]
  dockerfile = "services/hermes/Dockerfile"

[env]
  LOOI_AGENT_HOST = "0.0.0.0"
  LOOI_AGENT_DB_PATH = "/opt/data/looi-hermes/tasks.sqlite3"
  LOOI_HERMES_HOME = "/opt/data/looi-hermes/home"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "looi_hermes_data"
  destination = "/opt/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
